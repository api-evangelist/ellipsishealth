name: Ellipsis Health
description: >-
  Ellipsis Health is a healthcare AI company that has established the human voice
  as a vital sign for mental health, using clinically validated vocal-biomarker
  technology, natural language processing, and acoustic models to identify,
  measure, and monitor the severity of depression and anxiety from short samples
  of natural speech. Its flagship product, Sage, is an emotionally intelligent,
  agentic AI care manager that conducts 24/7 patient-engagement calls for health
  plans, health systems, specialty care, and pharma, handling program
  enrollment, benefits verification, clinical assessments and surveys, and care
  coordination. Sage is powered by Ellipsis' patented Empathy Engine, trained on
  millions of live clinical patient calls, and runs on HIPAA and SOC 2 Type 2
  compliant infrastructure. Ellipsis Health integrates with health plans and
  systems such as Cigna, and exposes a private partner API (used by partners like
  Augmedix) rather than a public developer platform. The company is backed by
  Khosla Ventures, Salesforce Ventures, and CVS Health Ventures.
